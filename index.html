<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Assistant</title>
    <!-- CSS styles go here -->
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">🤖 AI Assistant</div>
        <div class="chat-body" id="chatBody"></div>
        <form class="chat-footer" id="chatForm">
            <input type="text" id="userInput" placeholder="Type a message..." required autocomplete="off">
            <button type="submit">Send</button>
        </form>
    </div>

    <!-- SCRIPT GOES AT THE VERY BOTTOM -->
    <script>
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');
        const chatBody = document.getElementById('chatBody');

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = userInput.value.trim();
            if (!message) return;

            appendMessage(message, 'user');
            userInput.value = '';

            const typingElem = createTypingIndicator();
            chatBody.appendChild(typingElem);
            chatBody.scrollTop = chatBody.scrollHeight;

            try {
                const response = await fetch('https://my-ai-assistant-dc4p.onrender.com/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                chatBody.removeChild(typingElem);

                if (response.ok) {
                    appendMessage(data.reply || data.response || JSON.stringify(data), 'ai');
                } else {
                    appendMessage('Oops! Something went wrong 😅', 'ai');
                }
            } catch (err) {
                chatBody.removeChild(typingElem);
                appendMessage('Connection error. Is the server running? 🔌', 'ai');
            }
        });

        function appendMessage(text, sender) {
            const rowDiv = document.createElement('div');
            rowDiv.classList.add('msg-row', sender);

            const avatar = document.createElement('span');
            avatar.innerText = sender === 'user' ? '🧑‍💻' : '🤖';

            const bubbleDiv = document.createElement('div');
            bubbleDiv.classList.add('msg-bubble');
            bubbleDiv.innerHTML = text.replace(/\n/g, '<br>');

            rowDiv.appendChild(avatar);
            rowDiv.appendChild(bubbleDiv);

            chatBody.appendChild(rowDiv);
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function createTypingIndicator() {
            const rowDiv = document.createElement('div');
            rowDiv.classList.add('msg-row', 'ai');

            const avatar = document.createElement('span');
            avatar.innerText = '🤖';

            const bubbleDiv = document.createElement('div');
            bubbleDiv.classList.add('msg-bubble');
            bubbleDiv.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';

            rowDiv.appendChild(avatar);
            rowDiv.appendChild(bubbleDiv);
            return rowDiv;
        }
    </script>
</body>
</html>
