<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant 💬</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-window {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: #0a0a0a;
            border: 1px solid #1f1f1f;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
        }

        
        header {
            padding: 16px 20px;
            border-bottom: 1px solid #1f1f1f;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

   
        .chat-body {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .chat-body::-webkit-scrollbar {
            width: 5px;
        }

        .chat-body::-webkit-scrollbar-thumb {
            background: #222222;
            border-radius: 4px;
        }

   
        .msg-row {
            display: flex;
            gap: 10px;
            max-width: 85%;
        }

        .msg-row.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .msg-row.ai {
            align-self: flex-start;
        }

        .avatar-emoji {
            font-size: 18px;
            margin-top: 4px;
        }

        .msg-bubble {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14.5px;
            line-height: 1.5;
            word-break: break-word;
        }

        .user .msg-bubble {
            background: #2563eb;
            color: #ffffff;
            border-top-right-radius: 2px;
        }

        .ai .msg-bubble {
            background: #141414;
            color: #e5e5e5;
            border: 1px solid #222222;
            border-top-left-radius: 2px;
        }

        
        .input-bar {
            padding: 16px 20px;
            background: #0a0a0a;
            border-top: 1px solid #1f1f1f;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            background: #121212;
            border: 1px solid #262626;
            padding: 8px 8px 8px 16px;
            border-radius: 12px;
            align-items: center;
        }

        .input-wrapper:focus-within {
            border-color: #3b82f6;
        }

        .input-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 14.5px;
        }

        .input-wrapper input::placeholder {
            color: #666666;
        }

        .send-btn {
            background: #2563eb;
            border: none;
            color: #ffffff;
            width: 38px;
            height: 38px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: background 0.2s;
        }

        .send-btn:hover {
            background: #1d4ed8;
        }

        .typing {
            display: flex;
            gap: 4px;
            align-items: center;
            padding: 4px 0;
        }

        .typing span {
            width: 6px;
            height: 6px;
            background: #666666;
            border-radius: 50%;
            animation: pulse 1.2s infinite ease-in-out both;
        }

        .typing span:nth-child(1) { animation-delay: -0.32s; }
        .typing span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes pulse {
            0%, 80%, 100% { opacity: 0.2; }
            40% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="app-window">
      
        <header>
            <h1>⚡ PRIME Assistant <span>✨</span></h1>
        </header>

      
        <div class="chat-body" id="chatBody">
            <div class="msg-row ai">
                <span class="avatar-emoji">🤖</span>
                <div class="msg-bubble">
                    Hey there! 👋 How can I help you out today?
                </div>
            </div>
        </div>


        <div class="input-bar">
            <form class="input-wrapper" id="chatForm">
                <input type="text" id="userInput" placeholder="Ask anything... 💬" autocomplete="off" required>
                <button type="submit" class="send-btn">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
        </div>
    </div>

    <script>
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');
        const chatBody = document.getElementById('chatBody');

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = userInput.value.trim();
            if (!message) return;


            appendMessage(message, 'user');
            userInput.value = '';

           
            const typingElem = createTypingIndicator();
            chatBody.appendChild(typingElem);
            chatBody.scrollTop = chatBody.scrollHeight;

            try {
              // ✅ CORRECT WAY
const response = await fetch('https://my-ai-assistant.onrender.com/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: userMessage })
});

                const data = await response.json();
                chatBody.removeChild(typingElem);

                if (response.ok) {
                    appendMessage(data.reply, 'ai');
                } else {
                    appendMessage('Oops! Something went wrong 😅', 'ai');
                }
            } catch (err) {
                chatBody.removeChild(typingElem);
                appendMessage('Connection error. Is the server running? 🔌', 'ai');
            }
        });

        function appendMessage(text, sender) {
            const rowDiv = document.createElement('div');
            rowDiv.classList.add('msg-row', sender);

            const avatar = document.createElement('span');
            avatar.classList.add('avatar-emoji');
            avatar.innerText = sender === 'user' ? '🧑‍💻' : '🤖';

            const bubbleDiv = document.createElement('div');
            bubbleDiv.classList.add('msg-bubble');
            bubbleDiv.innerHTML = text.replace(/\n/g, '<br>');

            rowDiv.appendChild(avatar);
            rowDiv.appendChild(bubbleDiv);

            chatBody.appendChild(rowDiv);
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function createTypingIndicator() {
            const rowDiv = document.createElement('div');
            rowDiv.classList.add('msg-row', 'ai');

            const avatar = document.createElement('span');
            avatar.classList.add('avatar-emoji');
            avatar.innerText = '🤖';

            const bubbleDiv = document.createElement('div');
            bubbleDiv.classList.add('msg-bubble');
            bubbleDiv.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';

            rowDiv.appendChild(avatar);
            rowDiv.appendChild(bubbleDiv);
            return rowDiv;
        }
    </script>
</body>
</html>
