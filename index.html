<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Updated the tab name to PRIME AI -->
    <title>PRIME AI</title> 
    
    <!-- THIS STYLE BLOCK GIVES IT ALL THE COLORS AND SHAPES -->
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .chat-container { width: 100%; max-width: 600px; background: #1e293b; border-radius: 12px; display: flex; flex-direction: column; height: 80vh; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .chat-header { padding: 16px; background: #334155; font-weight: bold; text-align: center; font-size: 1.2rem; border-bottom: 1px solid #0f172a;}
        .chat-body { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
        .msg-row { display: flex; gap: 12px; align-items: flex-end; }
        .msg-row.user { flex-direction: row-reverse; }
        .msg-bubble { max-width: 75%; padding: 12px 16px; border-radius: 12px; background: #334155; line-height: 1.5; font-size: 0.95rem; }
        .user .msg-bubble { background: #2563eb; }
        .chat-footer { padding: 12px; background: #1e293b; display: flex; gap: 8px; border-top: 1px solid #334155; }
        input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; outline: none; font-size: 1rem; }
        button { padding: 12px 20px; background: #2563eb; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s;}
        button:hover { background: #1d4ed8; }
        .avatar-emoji { font-size: 1.5rem; }
        .typing span { display: inline-block; width: 6px; height: 6px; background: #94a3b8; border-radius: 50%; animation: blink 1.4s infinite; margin: 0 2px; }
        @keyframes blink { 0%, 100% { opacity: .2; } 20% { opacity: 1; } }
    </style>
</head>
<body>

<div class="chat-container">
    <!-- Updated the header name to PRIME AI -->
    <div class="chat-header">🤖 PRIME AI</div>
    
    <div class="chat-body" id="chatBody"></div>
    
    <form class="chat-footer" id="chatForm">
        <input type="text" id="userInput" placeholder="Type a message..." required autocomplete="off">
        <button type="submit">Send</button>
    </form>
</div>

<script>
    const chatForm = document.getElementById('chatForm');
    const userInput = document.getElementById('userInput');
    const chatBody = document.getElementById('chatBody');

    chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const message = userInput.value.trim();
        if (!message) return;

        appendMessage(message, 'user');
        userInput.value = '';

        const typingElem = createTypingIndicator();
        chatBody.appendChild(typingElem);
        chatBody.scrollTop = chatBody.scrollHeight;

        try {
            const response = await fetch('https://my-ai-assistant-dc4p.onrender.com/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message })
            });

            const data = await response.json();
            chatBody.removeChild(typingElem);

            if (response.ok) {
                appendMessage(data.reply || data.response || JSON.stringify(data), 'ai');
            } else {
                appendMessage('Oops! Something went wrong 😅', 'ai');
            }
        } catch (err) {
            chatBody.removeChild(typingElem);
            appendMessage('Connection error. Is the server running? 🔌', 'ai');
        }
    });

    function appendMessage(text, sender) {
        const rowDiv = document.createElement('div');
        rowDiv.classList.add('msg-row', sender);

        const avatar = document.createElement('span');
        avatar.classList.add('avatar-emoji');
        avatar.innerText = sender === 'user' ? '🧑‍💻' : '🤖';

        const bubbleDiv = document.createElement('div');
        bubbleDiv.classList.add('msg-bubble');
        bubbleDiv.innerHTML = text.replace(/\n/g, '<br>');

        rowDiv.appendChild(avatar);
        rowDiv.appendChild(bubbleDiv);

        chatBody.appendChild(rowDiv);
        chatBody.scrollTop = chatBody.scrollHeight;
    }

    function createTypingIndicator() {
        const rowDiv = document.createElement('div');
        rowDiv.classList.add('msg-row', 'ai');

        const avatar = document.createElement('span');
        avatar.classList.add('avatar-emoji');
        avatar.innerText = '🤖';

        const bubbleDiv = document.createElement('div');
        bubbleDiv.classList.add('msg-bubble');
        bubbleDiv.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';

        rowDiv.appendChild(avatar);
        rowDiv.appendChild(bubbleDiv);
        return rowDiv;
    }
</script>
</body>
</html>
