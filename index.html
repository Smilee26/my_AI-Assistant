<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRIME AI</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #090d16;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.12) 0px, transparent 50%);
            color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 650px;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            height: 85vh;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .chat-header {
            padding: 18px 24px;
            background: rgba(30, 41, 59, 0.5);
            font-weight: 600;
            text-align: center;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .chat-body {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Custom Sleek Scrollbar */
        .chat-body::-webkit-scrollbar {
            width: 6px;
        }
        .chat-body::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
        }
        .chat-body::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .msg-row {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }
        .msg-row.user {
            flex-direction: row-reverse;
        }

        .avatar-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .ai .avatar-icon {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }
        .user .avatar-icon {
            background: #334155;
            color: #94a3b8;
        }

        .msg-bubble {
            max-width: 78%;
            padding: 12px 18px;
            border-radius: 16px;
            line-height: 1.55;
            font-size: 0.95rem;
            letter-spacing: 0.2px;
        }
        .ai .msg-bubble {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom-left-radius: 4px;
            color: #e2e8f0;
        }
        .user .msg-bubble {
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: #ffffff;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.3);
        }

        .chat-footer {
            padding: 16px 20px;
            background: rgba(15, 23, 42, 0.9);
            display: flex;
            gap: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(30, 41, 59, 0.6);
            color: #f8fafc;
            outline: none;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }
        input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
            background: rgba(30, 41, 59, 0.9);
        }

        button {
            padding: 12px 22px;
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
        }
        button:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.35);
        }

        /* Typing Dots */
        .typing span {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #94a3b8;
            border-radius: 50%;
            animation: blink 1.4s infinite;
            margin: 0 2px;
        }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0%, 100% { opacity: .2; } 20% { opacity: 1; } }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <div class="avatar-icon" style="width:24px; height:24px;">✨</div>
        <span>PRIME AI</span>
    </div>
    
    <div class="chat-body" id="chatBody"></div>
    
    <form class="chat-footer" id="chatForm">
        <input type="text" id="userInput" placeholder="Ask PRIME AI anything..." required autocomplete="off">
        <button type="submit">Send</button>
    </form>
</div>

<script>
    const chatForm = document.getElementById('chatForm');
    const userInput = document.getElementById('userInput');
    const chatBody = document.getElementById('chatBody');

    const botIconSvg = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2 2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>`;
    const userIconSvg = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`;

    chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const message = userInput.value.trim();
        if (!message) return;

        appendMessage(message, 'user');
        userInput.value = '';

        const typingElem = createTypingIndicator();
        chatBody.appendChild(typingElem);
        chatBody.scrollTop = chatBody.scrollHeight;

        try {
            const response = await fetch('https://my-ai-assistant-dc4p.onrender.com/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message })
            });

            const data = await response.json();
            chatBody.removeChild(typingElem);

            if (response.ok) {
                appendMessage(data.reply || data.response || JSON.stringify(data), 'ai');
            } else {
                appendMessage('Oops! Something went wrong 😅', 'ai');
            }
        } catch (err) {
            chatBody.removeChild(typingElem);
            appendMessage('Connection error. Is the server running? 🔌', 'ai');
        }
    });

    function appendMessage(text, sender) {
        const rowDiv = document.createElement('div');
        rowDiv.classList.add('msg-row', sender);

        const avatar = document.createElement('div');
        avatar.classList.add('avatar-icon');
        avatar.innerHTML = sender === 'user' ? userIconSvg : botIconSvg;

        const bubbleDiv = document.createElement('div');
        bubbleDiv.classList.add('msg-bubble');
        bubbleDiv.innerHTML = text.replace(/\n/g, '<br>');

        rowDiv.appendChild(avatar);
        rowDiv.appendChild(bubbleDiv);

        chatBody.appendChild(rowDiv);
        chatBody.scrollTop = chatBody.scrollHeight;
    }

    function createTypingIndicator() {
        const rowDiv = document.createElement('div');
        rowDiv.classList.add('msg-row', 'ai');

        const avatar = document.createElement('div');
        avatar.classList.add('avatar-icon');
        avatar.innerHTML = botIconSvg;

        const bubbleDiv = document.createElement('div');
        bubbleDiv.classList.add('msg-bubble');
        bubbleDiv.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';

        rowDiv.appendChild(avatar);
        rowDiv.appendChild(bubbleDiv);
        return rowDiv;
    }
</script>
</body>
</html>
